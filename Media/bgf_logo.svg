<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#1f3350"/>
      <stop offset="60%" stop-color="#0f1a2c"/>
      <stop offset="100%" stop-color="#070b14"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1b8"/>
      <stop offset="35%" stop-color="#f2c457"/>
      <stop offset="70%" stop-color="#b47a1c"/>
      <stop offset="100%" stop-color="#6e4510"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe9a0"/>
      <stop offset="50%" stop-color="#d9a33a"/>
      <stop offset="100%" stop-color="#7a4d12"/>
    </linearGradient>
    <radialGradient id="lens" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#5fb8e8" stop-opacity="0.7"/>
      <stop offset="55%" stop-color="#1f5f8f" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0a2238" stop-opacity="0.9"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5fc8ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#5fc8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8cbcff"/><stop offset="100%" stop-color="#2a56a8"/>
    </linearGradient>
    <linearGradient id="heal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a6ffb0"/><stop offset="100%" stop-color="#2a9441"/>
    </linearGradient>
    <linearGradient id="dps" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffa394"/><stop offset="100%" stop-color="#a8231c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="iconShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background + frame -->
  <rect width="1024" height="1024" rx="90" fill="url(#bg)"/>
  <rect x="22" y="22" width="980" height="980" rx="72" fill="none" stroke="url(#gold)" stroke-width="12"/>
  <rect x="44" y="44" width="936" height="936" rx="56" fill="none" stroke="#6e4510" stroke-width="3"/>

  <g transform="translate(512 512) scale(1.25) translate(-488 -445)">
  <!-- Magnifying glass -->
  <g filter="url(#shadow)">
    <!-- handle (down-left, partly behind banner) -->
    <g transform="rotate(45 298 634)">
      <rect x="276" y="634" width="44" height="40" rx="8" fill="url(#goldH)"/>
      <rect x="280" y="668" width="36" height="150" rx="14" fill="#4a2a10" stroke="url(#goldH)" stroke-width="8"/>
      <rect x="272" y="736" width="52" height="14" rx="6" fill="url(#goldH)"/>
    </g>
    <circle cx="512" cy="420" r="340" fill="url(#glow)"/>
    <circle cx="512" cy="420" r="290" fill="url(#lens)"/>
    <circle cx="512" cy="420" r="290" fill="none" stroke="url(#gold)" stroke-width="30"/>
    <circle cx="512" cy="420" r="272" fill="none" stroke="#fff3c4" stroke-opacity="0.3" stroke-width="3"/>
  </g>

  <!-- Role icons (large) -->
  <!-- Healer: cross, top -->
  <g transform="translate(512 290) scale(1.7)" filter="url(#iconShadow)">
    <circle r="62" fill="url(#heal)" stroke="#eaffee" stroke-width="5"/>
    <path d="M-15,-42 H15 V-15 H42 V15 H15 V42 H-15 V15 H-42 V-15 H-15 Z" fill="#f4fff6"/>
  </g>
  <!-- Tank: shield, left -->
  <g transform="translate(395 490) scale(1.7)" filter="url(#iconShadow)">
    <path d="M0,-62 L52,-44 L52,4 C52,40 26,62 0,74 C-26,62 -52,40 -52,4 L-52,-44 Z"
          fill="url(#tank)" stroke="#e8f0ff" stroke-width="5"/>
    <path d="M0,-44 L0,58 M-34,-8 L34,-8" stroke="#e8f0ff" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
  </g>
  <!-- DPS: sword, right -->
  <g transform="translate(632 490) rotate(35) scale(1.7)" filter="url(#iconShadow)">
    <path d="M0,-80 L13,-60 L13,30 L-13,30 L-13,-60 Z" fill="url(#dps)" stroke="#ffecea" stroke-width="5" stroke-linejoin="round"/>
    <rect x="-38" y="30" width="76" height="15" rx="6" fill="url(#goldH)" stroke="#ffecea" stroke-width="3"/>
    <rect x="-8" y="45" width="16" height="34" rx="4" fill="#5a3312"/>
    <circle cy="87" r="12" fill="url(#goldH)"/>
  </g>

  <!-- lens highlight -->
  <path d="M290,280 A260,260 0 0 1 430,170" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="12" stroke-linecap="round"/>

  </g>
</svg>
